behaviors:
  default:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.02
        network_settings:
          hidden_units: 128
      gail:
        strength: 0.1
        demo_path: Assets/Demonstrations/
    behavioral_cloning:
      strength: 0.5
      steps: 1000000
      demo_path: Assets/Demonstrations/
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 20000

  Runner:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.015
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.05
        network_settings:
          hidden_units: 128
      gail:
        strength: 0.1
        demo_path: Assets/Demonstrations/
    behavioral_cloning:
      strength: 0.5
      steps: 750000
      demo_path: Assets/Demonstrations/
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 20000
