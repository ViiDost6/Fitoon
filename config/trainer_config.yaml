behaviors:
  Runner_Easy:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.00025 # Ligeramente menor para asimilar la nueva velocidad directa
      beta: 0.01             # Reducido: el bot ya no necesita "explorar" tanto si la velocidad es inmediata
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.05       # Reducida: queremos que se enfoque en la recompensa de velocidad
        network_settings:
          hidden_units: 128
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 2500000
    time_horizon: 128
    summary_freq: 10000

  Runner_Medium:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0002
      beta: 0.005            # Beta bajo para que sea muy preciso con la nueva física
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4           # Un epoch extra para estabilizar la política de movimiento
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        strength: 0.08
        network_settings:
          hidden_units: 256
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 20000

  Runner_Hard:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.00015 # Aprendizaje lento para manejar picos de velocidad de 100 unidades/s
      beta: 0.001            # Mínima entropía: queremos ejecución perfecta, no experimentación
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      curiosity:
        strength: 0.1
        network_settings:
          hidden_units: 512
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 10000000
    time_horizon: 512
    summary_freq: 20000